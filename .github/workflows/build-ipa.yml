name: Build Coreio IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Build unsigned
        run: |
          set -e
          PROJ=$(find . -maxdepth 4 -name "Coreio.xcodeproj" | head -1)
          echo "project = $PROJ"
          [ -n "$PROJ" ] || { echo "找不到 Coreio.xcodeproj"; exit 1; }
          xcodebuild \
            -project "$PROJ" \
            -target Coreio \
            -sdk iphoneos \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PWD/out" \
            build

      - name: Package ipa
        run: |
          set -e
          ls -la out
          mkdir -p dist/Payload
          cp -R out/Coreio.app dist/Payload/
          cd dist
          zip -qr Coreio.ipa Payload
          ls -lh Coreio.ipa

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: Coreio-ipa
          path: dist/Coreio.ipa
