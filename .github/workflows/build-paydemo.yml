name: Build PayFlowDemo IPA

on:
  push:
    branches: [paydemo]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA on macOS runner
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (code signing disabled)
        run: |
          xcodebuild \
            -project PayFlowDemo.xcodeproj \
            -scheme PayFlowDemo \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name 'PayFlowDemo.app' | head -n1)"
          if [ -z "$APP_PATH" ]; then echo "PayFlowDemo.app not found" >&2; exit 1; fi
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          (cd build/ipa && zip -r "../../PayFlowDemo-unsigned.ipa" Payload)

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PayFlowDemo-ipa
          path: PayFlowDemo-unsigned.ipa
          retention-days: 7

      - name: Publish IPA to public branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pub && cp PayFlowDemo-unsigned.ipa /tmp/pub/PayFlowDemo.ipa
          cd /tmp/pub
          git init -q && git checkout -q -b ipa-paydemo
          git add PayFlowDemo.ipa
          git -c user.name="paydemo-bot" -c user.email="bot@users.noreply.github.com" commit -q -m "paydemo ipa $(date -u +%Y%m%d-%H%M%S)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ipa-paydemo
          echo "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/ipa-paydemo/PayFlowDemo.ipa"
